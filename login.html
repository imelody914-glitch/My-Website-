<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Login & Sign Up Page</title>
 <link rel="stylesheet" href="login_style.css">
</head>
<body>
 <canvas id="petals"></canvas>
 <div class="decor decor-tr"></div>
<div class="decor decor-bl"></div>
 <div class="form-container">
 <h2 id="formTitle">Login</h2>
 <form id="authForm">
 <label for="username">Username</label>
 <input type="text" id="username" required>
 <label for="password">Password</label>
 <input type="password" id="password" required>
 <!-- Show Password Checkbox (only for Login) -->
 <div class="show-password" id="showPasswordContainer">
 <input type="checkbox" id="showPassword" onclick="togglePasswordVisibility()">
 <label for="showPassword">Show Password</label>
 </div>
 <!-- Confirm password field for sign-up form -->
 <label for="confirmPassword" id="confirmPasswordLabel" style="display: none;">Confirm Password</label>
 <input type="password" id="confirmPassword" style="display: none;">
 
 <!-- Password match message -->
 <p id="passwordMatchMessage" style="font-size: 14px; color: red; display: none;"></p>
 <button type="button" onclick="handleSubmit()">Login</button>
 <p id="errorMessage"></p>
 <!-- Toggle link to switch between forms -->
 <p id="toggleText">Don't have an account? <a href="#" onclick="toggleForm()">Sign Up</a></p>
 </form>
 </div>
 <!-- Embedded JavaScript -->
 <script>
 let isLogin = true;
 function toggleForm() {
 const formTitle = document.getElementById('formTitle');
 const confirmPassword = document.getElementById('confirmPassword');
 const confirmPasswordLabel = document.getElementById('confirmPasswordLabel');
 const submitButton = document.querySelector('button');
 const toggleText = document.getElementById('toggleText');
 const showPasswordContainer = document.getElementById('showPasswordContainer');
 // Clear form fields when toggling
 document.getElementById('authForm').reset();
 document.getElementById('errorMessage').textContent = ''; // Clear any error message
 if (isLogin) {
 // Switch to Sign-Up form
 formTitle.textContent = 'Sign Up';
 confirmPassword.style.display = 'block';
 confirmPasswordLabel.style.display = 'block';
 submitButton.textContent = 'Sign Up';
 toggleText.innerHTML = 'Already have an account? <a href="#" onclick="toggleForm()">Login</a>';
 showPasswordContainer.style.visibility = 'hidden'; // Hide without shifting layout
 isLogin = false;
 } else {
 // Switch to Login form
 formTitle.textContent = 'Login';
 confirmPassword.style.display = 'none';
 confirmPasswordLabel.style.display = 'none';
 submitButton.textContent = 'Login';
 toggleText.innerHTML = 'Don\'t have an account? <a href="#" onclick="toggleForm()">Sign Up</a>';
 showPasswordContainer.style.visibility = 'visible'; // Show Show Password checkbox
 isLogin = true;
 }
}
 function handleSubmit() {
 const username = document.getElementById('username').value;
 const password = document.getElementById('password').value;
 const errorMessage = document.getElementById('errorMessage');
 if (isLogin) {
 const storedUsername = localStorage.getItem('username');
 const storedPassword = localStorage.getItem('password');
 if (username === storedUsername && password === storedPassword) {
 alert('Welcome! Successfully logged in.'); // This line triggers the alert
window.location.href = 'index.html'; // Redirect to home page if credentials are valid
 } else {
 errorMessage.textContent = 'Invalid username or password';
 }
 } else {
 const confirmPassword = document.getElementById('confirmPassword').value;
 if (password !== confirmPassword) {
 errorMessage.textContent = 'Passwords do not match';
 } else if (username && password) {
 localStorage.setItem('username', username);
localStorage.setItem('password', password);
 alert('Account created successfully! You can now log in.');
document.getElementById('authForm').reset();
toggleForm(); // Switch back to login form after sign-up
 } else {
 errorMessage.textContent = 'Please fill out all fields';
 }
 }
 }
 function togglePasswordVisibility() {
 const passwordField = document.getElementById('password');
 if (passwordField.type === 'password') {
 passwordField.type = 'text';
 } else {
 passwordField.type = 'password';
 }
 }
 document.getElementById('confirmPassword').addEventListener('input', checkPasswordMatch);
 function checkPasswordMatch() {
 const password = document.getElementById('password').value;
 const confirmPassword = document.getElementById('confirmPassword').value;
 const message = document.getElementById('passwordMatchMessage');
 if (confirmPassword === "") {
 message.style.display = 'none';
 } else if (confirmPassword === password) {
 message.textContent = 'Passwords match';
 message.style.color = 'green';
 message.style.display = 'block';
 } else {
 message.textContent = 'Passwords do not match';
 message.style.color = 'red';
 message.style.display = 'block';
 }
 }
</script>
 <button id="themeBtn" type="button" aria-label="Toggle light and dark mode"
  style="position:fixed; right:16px; bottom:16px; width:44px; height:44px; padding:0; border-radius:50%; border:2px solid rgba(255,255,255,0.7); background:linear-gradient(135deg,#1e5fd0,#2f80ed); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:9999; box-shadow:0 4px 12px rgba(47,128,237,0.5);">
  <svg id="themeIcon" viewBox="0 0 24 24" width="22" height="22" style="display:block;">
    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/>
  </svg>
</button>

<script>
(function () {
  var pw = document.querySelector('input[type="password"]');
  var el = pw ? pw.parentElement : null;
  while (el && el !== document.body) {
    var cs = getComputedStyle(el);
    var hasBg = cs.backgroundImage !== 'none' ||
      (cs.backgroundColor !== 'rgba(0, 0, 0, 0)' && cs.backgroundColor !== 'transparent');
    if (hasBg && parseFloat(cs.borderTopLeftRadius) > 0) {
      el.setAttribute('data-card', '');
      break;
    }
    el = el.parentElement;
  }
})();
</script>
 <script>
(function () {
  var btn = document.getElementById('themeBtn');
  var icon = document.getElementById('themeIcon');
  var moon = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/>';
  var sun = '<circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.6" y1="4.6" x2="6.4" y2="6.4"/><line x1="17.6" y1="17.6" x2="19.4" y2="19.4"/><line x1="4.6" y1="19.4" x2="6.4" y2="17.6"/><line x1="17.6" y1="6.4" x2="19.4" y2="4.6"/></g>';

  // Find the card around the password field
  var pw = document.querySelector('input[type="password"]');
  var card = null, el = pw ? pw.parentElement : null;
  while (el && el !== document.body) {
    var cs = getComputedStyle(el);
    var hasBg = cs.backgroundImage !== 'none' ||
      (cs.backgroundColor !== 'rgba(0, 0, 0, 0)' && cs.backgroundColor !== 'transparent');
    if (hasBg && parseFloat(cs.borderTopLeftRadius) > 0) { card = el; break; }
    el = el.parentElement;
  }

  var touched = [];
  function paint(node, props) {
    for (var k in props) node.style.setProperty(k, props[k], 'important');
    touched.push(node);
  }
  function clearAll() {
    touched.forEach(function (n) { n.removeAttribute('style'); });
    touched = [];
  }

  function applyLight() {
    if (!card) return;
    paint(card, { 'background': 'linear-gradient(135deg,#ffffff,#dbeaff)', 'border-color': '#9cc2f5' });
    card.querySelectorAll('h1,h2,h3,label,p,span').forEach(function (n) {
      paint(n, { 'color': '#0b3a8c', '-webkit-text-fill-color': '#0b3a8c' });
    });
    card.querySelectorAll('a').forEach(function (n) {
      paint(n, { 'color': '#1e5fd0', '-webkit-text-fill-color': '#1e5fd0' });
    });
    card.querySelectorAll('input[type="text"],input[type="password"],input[type="email"]').forEach(function (n) {
      paint(n, { 'background': '#ffffff', 'color': '#0b2a5b', 'border': '2px solid #9cc2f5' });
    });
    card.querySelectorAll('button').forEach(function (n) {
      paint(n, { 'background': 'linear-gradient(135deg,#1e5fd0,#2f80ed)', 'color': '#ffffff', '-webkit-text-fill-color': '#ffffff' });
    });
  }

  function apply(light) {
    document.body.classList.toggle('light-mode', light);
    icon.innerHTML = light ? sun : moon;
    clearAll();

    [document.documentElement, document.body].forEach(function (t) {
      if (light) {
        t.style.removeProperty('background');
        t.style.removeProperty('background-size');
      } else {
        t.style.setProperty('background',
          'linear-gradient(rgba(120,170,255,0.12) 1px, transparent 1px), ' +
          'linear-gradient(90deg, rgba(120,170,255,0.12) 1px, transparent 1px), #071a45',
          'important');
        t.style.setProperty('background-size', '60px 60px', 'important');
      }
    });

    if (light) applyLight();
  }

  var saved = false;
  try { saved = localStorage.getItem('theme') === 'light'; } catch (e) {}
  apply(saved);

  btn.addEventListener('click', function () {
    var light = !document.body.classList.contains('light-mode');
    apply(light);
    try { localStorage.setItem('theme', light ? 'light' : 'dark'); } catch (e) {}
  });
})();
</script>
 <script>
(function () {
  const canvas = document.getElementById('petals');
  const ctx = canvas.getContext('2d');
  const colors = ['#6CC8FF', '#3FA9F5', '#2F7FE0', '#9FE0FF', '#8FD3FF'];
  const COUNT = 35;
  let petals = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function makePetal(initial) {
    return {
      x: Math.random() * canvas.width,
      y: initial ? Math.random() * canvas.height : -20,
      size: 6 + Math.random() * 9,
      speed: 0.6 + Math.random() * 1.2,
      drift: Math.random() * Math.PI * 2,
      driftSpeed: 0.01 + Math.random() * 0.02,
      sway: 0.4 + Math.random() * 0.8,
      angle: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.04,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 0.5 + Math.random() * 0.4
    };
  }

  function drawPetal(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(0, -p.size);
    ctx.bezierCurveTo(p.size, -p.size * 0.6, p.size * 0.8, p.size * 0.7, 0, p.size);
    ctx.bezierCurveTo(-p.size * 0.8, p.size * 0.7, -p.size, -p.size * 0.6, 0, -p.size);
    ctx.fill();
    ctx.restore();
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    petals.forEach((p, i) => {
      p.y += p.speed;
      p.drift += p.driftSpeed;
      p.x += Math.sin(p.drift) * p.sway;
      p.angle += p.spin;
      drawPetal(p);
      if (p.y > canvas.height + 20) petals[i] = makePetal(false);
    });
    requestAnimationFrame(animate);
  }

  resize();
  petals = Array.from({ length: COUNT }, () => makePetal(true));
  window.addEventListener('resize', resize);

  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    animate();
  }
})();
</script>
 <script src="popup.js"></script>
<style>
 .ui-pop-btn{margin:0;width:auto;text-transform:none;letter-spacing:0}
 .ui-pop h3,.ui-pop p{text-align:center}
</style>
 
</body>
</html>
